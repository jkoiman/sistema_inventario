<!DOCTYPE html>
<html>
<head>
<title>Inventario de Tienda</title>
</head>
<body>

<h1>Sistema de Inventario</h1>

<h2>Registro de clientes</h2>

<form id="formulario-cliente">
<label for="nombre-cliente">Nombre completo:</label>
<input id="nombre-cliente" name="nombre" type="text" autocomplete="name" required>

<br><br>

<label for="documento-cliente">Documento:</label>
<input id="documento-cliente" name="documento" type="text" required>

<br><br>

<label for="telefono-cliente">Teléfono:</label>
<input id="telefono-cliente" name="telefono" type="tel" autocomplete="tel" required>

<br><br>

<label for="correo-cliente">Correo electrónico:</label>
<input id="correo-cliente" name="correo" type="email" autocomplete="email" required>

<br><br>

<button type="submit">Registrar cliente</button>
</form>

<p id="mensaje-clientes" role="status" aria-live="polite"></p>

<h3>Listado de clientes</h3>

<table border="1">
<thead>
<tr>
<th>Nombre</th>
<th>Documento</th>
<th>Teléfono</th>
<th>Correo electrónico</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="lista-clientes"></tbody>
</table>

<h2>Registro de productos</h2>

<label>Nombre del producto:</label>
<input type="text">

<br><br>

<label>Cantidad:</label>
<input type="number">

<br><br>

<button>Registrar producto</button>

<h2>Listado de productos</h2>

<table border="1">
<tr>
<th>Producto</th>
<th>Cantidad</th>
</tr>

<tr>
<td>Computador</td>
<td>10</td>
</tr>

<tr>
<td>Mouse</td>
<td>20</td>
</tr>
</table>

<script src="clientes.js" defer></script>
</body>
</html>
